# Reverse proxy for StudyPet+: forward traffic to the Next.js app container
# over the internal compose network.
#
# THIS LISTENER IS NOT THE PUBLIC EDGE. It speaks plain HTTP on purpose, because
# it is the internal hop behind a TLS terminator that owns the certificates and
# the public :443 listener (the live deployment uses Nginx Proxy Manager; any
# reverse proxy or load balancer works). Publishing this port straight to the
# internet would put session cookies, magic links and MFA traffic on the wire in
# the clear.
#
# The terminator MUST:
#   * redirect http:// to https:// itself, and
#   * forward X-Forwarded-Proto: https (this config passes $scheme through, and
#     the app reads NEXTAUTH_URL for its canonical origin regardless).
#
# The app refuses to boot in production when NEXTAUTH_URL is not https:// (see
# src/instrumentation.ts), so a stack wired up without a terminator fails at
# startup rather than silently serving plaintext.
#
# To make this stack self-contained instead, mount certs (see
# docker-compose.yml), uncomment the 443 server block at the bottom, and change
# the :80 server to `return 301 https://$host$request_uri;`.

upstream studypet_app {
    server app:3000;
}

server {
    listen 80;
    server_name _;

    # Allow larger uploads (e.g. pasted notes / files).
    client_max_body_size 10m;

    location / {
        proxy_pass         http://studypet_app;
        proxy_http_version 1.1;

        # Preserve the original host/scheme so NextAuth builds correct callback URLs.
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Support WebSocket / HMR upgrades.
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_read_timeout 60s;
    }
}

