# Reverse proxy for StudyPet+: accept client traffic on :80 and forward it to
# the Next.js app container over the internal compose network.
#
# To enable HTTPS: mount certs (see docker-compose.yml), uncomment the 443
# server block below, and redirect :80 -> :443.

upstream studypet_app {
    server app:3000;
}

server {
    listen 80;
    server_name _;

    # Allow larger uploads (e.g. pasted notes / files).
    client_max_body_size 10m;

    location / {
        proxy_pass         http://studypet_app;
        proxy_http_version 1.1;

        # Preserve the original host/scheme so NextAuth builds correct callback URLs.
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Support WebSocket / HMR upgrades.
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_read_timeout 60s;
    }
}

