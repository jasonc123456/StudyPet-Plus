# Local Postgres for StudyPet+ development.
# Start with: docker compose up -d
# DATABASE_URL in .env should match the credentials below.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: studypet
      POSTGRES_PASSWORD: studypet
      POSTGRES_DB: studypet
    volumes:
      - studypet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U studypet -d studypet']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  studypet_pgdata:
