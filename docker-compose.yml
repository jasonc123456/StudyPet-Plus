# StudyPet+ production deployment stack.
#
#   TLS terminator ──> nginx (:80) ── reverse proxy ──> app (:3000) ──> postgres
#
# REQUIRES A TLS TERMINATOR IN FRONT. This stack has no public HTTPS listener:
# nginx here is the internal hop, and the terminator in front of it owns the
# certificates, the public :443 listener, and the http->https redirect. The live
# deployment uses Nginx Proxy Manager; any reverse proxy or load balancer works.
# Do not publish port 80 below to the internet directly — authentication traffic
# would cross the network in the clear.
#
# NEXTAUTH_URL must be the public https:// origin. The app refuses to start in
# production otherwise (src/instrumentation.ts), so a stack brought up without a
# terminator fails loudly instead of quietly serving plaintext.
#
# To run this stack standalone with its own TLS, see the notes in
# deploy/nginx/conf.d/default.conf.
#
# Usage:
#   cp .env.example .env      # fill in real secrets
#   docker compose up -d --build
#
# Secrets are read from .env (gitignored — never commit it).
# See the "Deployment (Docker Compose)" section of README.md.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studypet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studypet}
      POSTGRES_DB: ${POSTGRES_DB:-studypet}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studypet} -d ${POSTGRES_DB:-studypet}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published to the host — only the app reaches it over the compose network.

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Force the DB host to the compose service name, overriding any localhost
      # DATABASE_URL inherited from .env (which targets local dev).
      DATABASE_URL: postgresql://${POSTGRES_USER:-studypet}:${POSTGRES_PASSWORD:-studypet}@postgres:5432/${POSTGRES_DB:-studypet}?schema=public
      # Explicit AI passthrough so flashcard/quiz generation sees keys at runtime
      # even if env_file loading differs across compose versions.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      AI_DEMO_MODE: ${AI_DEMO_MODE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      # Bound to loopback: this is the hop a TLS terminator on the same host
      # proxies to, not a public listener. Change to "80:80" only if something
      # else in front is already terminating TLS on another host/network.
      - "127.0.0.1:80:80"
      # - "443:443"   # enable after adding TLS certs + an HTTPS server block
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      # - ./deploy/nginx/certs:/etc/nginx/certs:ro

volumes:
  pgdata:
